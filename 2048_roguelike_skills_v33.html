{name:'オーガ',hp:28,atk:5,type:'ogre',desc:'力を溜め、次の攻撃を2倍にする。'},

['生贄','致死ダメージを受けたとき、盤面の最大値のタイルを1つを生贄にして復活。','sacrifice','card'],

];
function $(x){return document.getElementById(x)}function level(id){return typeof skills[id]==='number'?skills[id]:(skills[id]?1:0)}function owned(id){return level(id)>0}function empty(){return Array(16).fill(0)}function spawnCandidates(){let a=[...new Set(board.filter(Boolean))].filter(x=>x>minSpawnValue);if(skills.chaos&&a.length)return a;let normal=[2,2,2,2,2,2,2,2,2,4].filter(x=>x>minSpawnValue);if(normal.length){let r=normal;if(r.length)return r}if(skills.ouroboros&&minSpawnValue>0)return [minSpawnValue*2];return normal}function spawnTileAt(i){if(i<0||i>=16||board[i])return false;let c=spawnCandidates();if(!c.length)return false;let v=c[Math.floor(Math.random()*c.length)];if(skills.extraction)v*=4;if(v<=minSpawnValue)return false;board[i]=v;turnNewTiles.push({i,v});return true}function addRandom(){let n=skills.chaos?2:1;for(let z=0;z<n;z++){spawnCount++;if(skills.extraction&&spawnCount%2===0)continue;let e=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(!e.length)continue;let i=e[Math.floor(Math.random()*e.length)];spawnTileAt(i)}}function addMummyMergeTile(){let e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!e.length)return false;let normal=[2,2,2,2,2,2,2,2,2,4].filter(x=>x>minSpawnValue);if(!normal.length)return false;let v=normal[Math.floor(Math.random()*normal.length)];if(skills.extraction)v*=4;if(v<=minSpawnValue)return false;let i=e[Math.floor(Math.random()*e.length)];board[i]=v;turnNewTiles.push({i,v,mummy:true});return true}
function spawnMummyMinTile(){let vals=board.filter(Boolean),e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!vals.length||!e.length)return false;let v=Math.min(...vals);if(v<=minSpawnValue)return false;let i=e[Math.floor(Math.random()*e.length)];board[i]=v;turnNewTiles.push({i,v,mummy:true,noExtraction:true});return true}
function removeRandom(){let e=board.map((v,i)=>v?i:-1).filter(i=>i>=0);if(e.length)board[e[Math.floor(Math.random()*e.length)]]=0}function ensureBoardNotEmpty(){if(board.some(v=>v))return false;let i=Math.floor(Math.random()*16);if(!spawnTileAt(i)){let fallback=minSpawnValue>0?minSpawnValue*2:2;board[i]=fallback;turnNewTiles.push({i,v:fallback})}return true}
function processEmperor(){if(!skills.emperor)return 0;let vals=board.filter(Boolean),mx=vals.length?Math.max(...vals):0;if(mx>previousMax){let delta=mx-previousMax;baseAttack+=delta;emperorBonus+=delta;previousMax=mx;return delta}return 0}function recordRaised(before){for(let i=0;i<16;i++){let b=before[i]||0,v=board[i]||0;if(v>b)turnNewTiles.push({i,v,raised:true})}}function triggerGreed(){if(!skills.greed)return 0;let removed=0,removedValues=[];let seen=new Set();for(let x of turnNewTiles){if(seen.has(x.i))continue;let v=board[x.i]||0;if(!x.greedSafe&&x.v>greedRecord&&v>greedRecord){board[x.i]=0;removed++;removedValues.push(v);seen.add(x.i)}}if(removed){greedMultiplier*=Math.pow(1.1,removed);let uro=false;if(skills.ouroboros&&!greedUroborosUsed){let direct=Math.floor((removedValues[0]||0)/8);if(direct>minSpawnValue){let e=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(e.length){let i=e[Math.floor(Math.random()*e.length)];board[i]=direct;turnNewTiles.push({i,v:direct,greedSafe:true});uro=true;greedUroborosUsed=true}}}$('log').textContent=`強欲！基準値${fmt(greedRecord)}を超えた増加タイルを${removed}個消去、コンボ倍率×${Math.pow(1.1,removed).toFixed(2)}${uro?'、ウロボロスで1/8を出現！':''}`;render()}return removed}
function spawnEnemy(){let t=enemies[(floor-1)%enemies.length],hp=floor===1?400:Math.round(enemy.maxHp*(floor>100?floor/50:1.4)),atk=2;if(skills.backwater)playerHp=Math.max(0,maxHp/2);for(let f=2;f<=floor;f++){if(f%10===1)atk=Math.round(atk*1.5);if(f%50===0)atk*=f/5;else atk+=1}enemy={name:t.name,hp,maxHp:hp,atk,type:t.type,desc:t.desc};if(skills.reaper)enemy.atk*=Math.pow(2,level('reaper'));enemyTurn=0;enemyCharge=false}
function fmt(n){n=Math.max(0,Math.round(n));if(n<=8192)return String(n);let units=[['T',1e12],['G',1e9],['M',1e6],['K',1e3]];for(let [u,v] of units)if(n>=v)return Math.floor(n/v)+u;return Math.floor(n/1e3)+'K'}function fmtDamage(n){return String(Math.max(0,Math.round(n)))}function render(){let b=$('board');b.innerHTML='';board.forEach((v,i)=>{let d=document.createElement('div');d.className='tile '+(v?'t'+v:'')+(i===mageTarget?' mageTarget':'')+(i===hunterTarget?' hunterTarget':'');d.textContent=v?fmt(v):'';b.appendChild(d)});$('floor').textContent=floor;$('atk').textContent=fmt(baseAttack);$('score').textContent=fmt(score);$('enemyName').textContent=enemy.name;$('enemyText').textContent=`${fmt(enemy.hp)} / ${fmt(enemy.maxHp)}`;$('enemyHp').style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+'%';$('playerHp').textContent=`${fmt(playerHp)} / ${fmt(maxHp)}`;$('playerHpFill').style.width=Math.max(0,playerHp/maxHp*100)+'%';updateComboDisplay();renderSkills();refreshTimer()}
function renderSkills(){
  let box=$('skillList');box.innerHTML='';

function timeLimit(){let t=1900+skills.comboTime*150-Math.max(0,combo-1)*240-skills.dependence*10-skills.gambler*30;if(skills.magician)t*=.7;t+=embryoTimeBonus;return Math.max(0.01,t)}function mult(){let m=(1+Math.max(0,combo-1)*(.08+skills.comboUp*.05)+heroBonus)*greedMultiplier;if(skills.magician)m*=2;return m}function updateComboDisplay(){$('combo').textContent=combo;$('mult').textContent='×'+mult().toFixed(2)}function refreshTimer(){let r=combo&&deadline?Math.max(0,deadline-Date.now()):0;$('timer').textContent=combo&&deadline?(r/1000).toFixed(1)+'s':'-';$('comboFill').style.width=combo?Math.max(0,r/timeLimit()*100)+'%':'0%'}function startTimer(){clearInterval(timerId);if(!combo)return;timerId=setInterval(()=>{if(!canMove||paused){refreshTimer();return}if(Date.now()>=deadline){let oldCombo=combo;combo=Math.max(0,combo-1);deadline=combo?Date.now()+timeLimit():0;if(combo!==oldCombo){updateComboDisplay();if(combo)comboVisual(combo)}if(!combo){clearInterval(timerId);timerId=null}}refreshTimer()},50)}
function slide(a,rev){let x=rev?[...a].reverse():[...a],c=x.filter(Boolean),r=[],g=[],m=[];for(let i=0;i<c.length;i++){if(i+1<c.length&&c[i]===c[i+1]){r.push(c[i]*2);g.push(c[i]*2);m.push(r.length-1);i++}else r.push(c[i])}while(r.length<4)r.push(0);if(rev)m=m.map(i=>3-i);return {v:rev?r.reverse():r,g,m}}
function ensureAudio(){try{if(!audioCtx||audioCtx.state==='closed'){let C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx=new C();}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}function unlockAudio(){let a=ensureAudio();if(a&&a.state==='suspended')a.resume().catch(()=>{});if(a){try{let g=a.createGain();g.gain.value=0;g.connect(a.destination);let o=a.createOscillator();o.frequency.value=1;o.connect(g);o.start();o.stop(a.currentTime+.01)}catch(e){}}}function tone(freq,dur=.08,type='sine',gain=.035){let a=ensureAudio();if(!a)return;if(a.state==='suspended'){a.resume().then(()=>tone(freq,dur,type,gain)).catch(()=>{});return}try{let o=a.createOscillator(),g=a.createGain(),now=a.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(gain,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(a.destination);o.start(now);o.stop(now+dur)}catch(e){}}function playComboSound(c){let a=ensureAudio();if(!a)return;if(c>=20){let seq=[523,659,784,1047,1319];seq.forEach((f,i)=>setTimeout(()=>tone(f,.11,i%2?'sine':'triangle',.042),i*65));setTimeout(()=>tone(1568,.18,'sine',.032),330);return}let n=Math.max(1,Math.min(20,c));let f1=280+(n-1)*24;let f2=f1+95;let f3=f2+115;tone(f1,.075,'triangle',.042);setTimeout(()=>tone(f2,.085,'sine',.032),48);if(n>=4)setTimeout(()=>tone(f3,.10,'triangle',.028),96)}function playHitSound(){ensureAudio();tone(150,.08,'sawtooth',.04);setTimeout(()=>tone(90,.12,'square',.025),35)}function playEnemyDefeatSound(){ensureAudio();tone(520,.12,'triangle',.05);setTimeout(()=>tone(780,.16,'sine',.04),80);setTimeout(()=>tone(1040,.22,'sine',.03),170)}function playPlayerHitSound(){ensureAudio();tone(100,.12,'sawtooth',.045);setTimeout(()=>tone(65,.15,'square',.03),50)}function comboVisual(c){let p=document.querySelector('.comboBar');if(!p)return;p.classList.remove('comboBarShake');void p.offsetWidth;p.classList.add('comboBarShake')}function bubble(n,type='enemy'){let p=type==='player'?$('playerDamageStage'):$('damageStage'),d=document.createElement('div');d.className='dmg '+(type==='player'?'pdmg':'');d.textContent='-'+fmtDamage(n);p.appendChild(d);setTimeout(()=>d.remove(),1100)}function shake(){document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),240)}

if(mageTarget>=0){let i=mageTarget;if(board[i]!==0){let next=Math.floor(board[i]/2);if(next>=2&&next>minSpawnValue){board[i]=next;$('log').textContent='魔術師が指定したマスを半分にした！'}else{$('log').textContent='魔術師の攻撃は無効になった！'}mageTarget=-1}else{mageTarget=-1}}
previousMax=Math.max(...before);if(skills.chaos)removeRandom();if(g.length){if(skills.embryo)embryoTimeBonus+=50;combo+=skills.embryo?g.length:1;deadline=Date.now()+timeLimit();startTimer();playComboSound(combo);comboVisual(combo);if(skills.dependence && combo>=2)baseAttack+=6;processEmperor();let sum=board.reduce((a,v)=>a+v,0),h=skills.hunger?board.filter(v=>v===0).length*.25:1,damage=Math.floor(baseAttack*sum*mult()*h);if(enemy.type==='golem'){let cut=Math.min(1,1.2/Math.max(1,combo));damage=Math.floor(damage*(1-cut));}if(skills.overreaction&&g.some(v=>v>=previousMax))damage*=3;if(skills.mummy)damage*=2;if(skills.berserker&&playerHp<=maxHp*.75)damage*=2;if(skills.backwater)damage*=maxHp/Math.max(1,playerHp)/2;if(skills.gambler){let p=Math.min(.95,.5+Math.max(0,combo-1)*.05);damage*=Math.random()<p?2:.5}damage=Math.max(0,Math.round(damage));let attacks=g.length+(skills.chainCannon&&g.length>=3?1:0)+(skills.chainCannon&&g.length>=5?1:0);for(let i=0;i<attacks;i++){enemy.hp-=damage;score+=damage;if(enemy.hp<=0)break}bubble(damage);playHitSound();triggerGreed();$('log').textContent=`合体攻撃！ ${fmtDamage(damage)}ダメージ ×${attacks}回 / ${combo}コンボ`;}else{if(skills.accumulation)baseAttack*=1.01;$('log').textContent='スライド！'}if(!skills.mummy){addRandom()}else if(g.length){for(let z=0;z<g.length;z++)addMummyMergeTile()}else{spawnMummyMinTile()}processEmperor();if(!g.length)triggerGreed();if(ensureBoardNotEmpty()){processEmperor();$('log').textContent='盤面が空になったため、通常の出現ルールで数字を配置！'}if(!board.every(v=>v===0)&&!canMoves()){render();gameOver();return}
if(enemy.hp<=0){canMove=false;if(combo&&deadline&&!freezeStarted)freezeStarted=Date.now();render();playEnemyDefeatSound();enemyDefeatVisual();setTimeout(()=>win(),420);return}enemyAttack();if(skills.hero)heroBonus+=.02;if(skills.blessing){let loss=Math.max(1,Math.floor(maxHp/16));playerHp=Math.max(0,playerHp-loss);baseAttack*=1.02}if(isDead())gameOver();render()}
function enemyAttack(){enemyTurn++;let action='';if(enemy.type==='slime'&&enemyTurn%3===0){let heal=Math.max(1,Math.floor(enemy.maxHp*.01));enemy.hp=Math.min(enemy.maxHp,enemy.hp+heal);let e=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(e.length){let splitValue=Math.min(...board.filter(Boolean));if(splitValue>minSpawnValue){let i=e[Math.floor(Math.random()*e.length)];board[i]=splitValue;turnNewTiles.push({i,v:splitValue})}action=`スライムが分裂！HP+${fmt(heal)}`}}if(enemy.type==='ogre'&&enemyTurn%3===0){enemyCharge=true;action='オーガが力を溜めている！'}let d=Math.max(1,Math.round(enemy.atk*(0.8+Math.random()*0.2)));if(enemy.type==='ogre'&&enemyCharge&&enemyTurn%3!==0){d*=2;enemyCharge=false;action='オーガの強烈な一撃！'}if(enemy.type==='mage'&&enemyTurn%2===0){let ids=board.map((v,i)=>v?i:-1).filter(i=>i>=0);let vals=board.filter(Boolean);if(ids.length&&vals.length>1){mageTarget=ids[Math.floor(Math.random()*ids.length)];action='魔術師が半分にするマスを指定した！'}}if(enemy.type==='hunter'&&enemyTurn%6===1){let vals=board.filter(Boolean);if(vals.length){hunterTargetValue=Math.max(...vals);hunterTarget=board.indexOf(hunterTargetValue);action='ハンターが狙いを定めた！'}}if(enemy.type==='hunter'&&enemyTurn%6===0){let i=hunterTarget;if(i>=0&&board[i]===hunterTargetValue){let mx=board[i],next=Math.floor(mx/4);if(next>=2&&next>minSpawnValue){board[i]=next;action=`ハンターが最大値 ${mx} を4分の1にした！`}else{action='ハンターの攻撃は無効になった！'}}else if(i>=0){action='ハンターの狙いが外れた！'}hunterTarget=-1;hunterTargetValue=0}if(triggerGreed()&&board.every(v=>v===0))ensureBoardNotEmpty();if(skills.colored)d=Math.ceil(maxHp/2);if(skills.hero)d=Math.ceil(d*1.5);playerHp=Math.max(0,playerHp-d);if(d){bubble(d,'player');playPlayerHitSound();shake();if(skills.grudge)baseAttack*=1.01;$('log').textContent=(action?action+' ':'')+`敵の攻撃！ ${fmtDamage(d)}ダメージ`};if(playerHp<=0&&skills.sacrifice){let v=board.filter(Boolean);if(v.length>=2){let m=Math.max(...v),i=board.indexOf(m);board[i]=0;playerHp=Math.min(maxHp,m);$('log').textContent=`生贄！ ${fmt(m)}を犠牲に復活！`}}if(playerHp<=0)return function win(){mageTarget=-1;hunterTarget=-1;hunterTargetValue=0;if(skills.multiplication){let v=board.filter(Boolean),e=board.map((x,i)=>x? -1:i).filter(i=>i>=0);if(v.length&&e.length){let m=Math.min(...v),n=Math.min(3,e.length);for(let z=0;z<n;z++){let k=Math.floor(Math.random()*e.length),i=e.splice(k,1)[0];if(m>minSpawnValue){board[i]=m;turnNewTiles.push({i,v:m})}}}}if(!board.every(v=>v===0)&&!canMoves()){render();gameOver();return}if(triggerGreed()&&board.every(v=>v===0))ensureBoardNotEmpty();if(!board.every(v=>v===0)&&!canMoves()){render();gameOver();return}score+=enemy.maxHp;floor++;playerHp=maxHp;skills.chaos=false;spawnEnemy();canMove=false;freezeStarted=freezeStarted||Date.now();render();if(!paused){if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;showUpgrade()}}
function isDead(){return playerHp<=0||(!board.every(v=>v===0)&&!canMoves())}function canMoves(){if(board.some(v=>!v))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=r*4+c;if(c<3&&board[i]===board[i+1]||r<3&&board[i]===board[i+4])return true}return false}function gameOver(){$('final').textContent=`到達フロア: ${floor}　スコア: ${score}`;$('gameover').style.display='flex';canMove=false;clearInterval(timerId)}
function apply(id){let s=defs.find(x=>x[2]===id);if(!s)return;let beforeApply=board.slice();skills[id]=typeof skills[id]==='number'?skills[id]+1:true;if(id==='extraction'){if(skills.greed&&Number.isFinite(greedRecord)&&greedRecord>0)greedRecord*=4;}if(id==='emperor'){let v=board.filter(Boolean),mx=v.length?Math.max(...v):0;baseAttack+=mx;emperorBonus+=mx;previousMax=mx}if(id==='greed'){let v=board.filter(Boolean);greedRecord=v.length?Math.max(...v):0;greedUroborosUsed=false}if(id==='maxHp'){maxHp*=2;levelMaxHpFactor*=2;playerHp+=maxHp/2}if(id==='weakling'){let newMaxHp=Math.max(1,Math.floor(maxHp/2)),loss=maxHp-newMaxHp;maxHp=newMaxHp;playerHp=Math.min(playerHp,maxHp);baseAttack+=loss}if(id==='ouroboros'){let v=board.filter(Boolean);if(v.length){let mn=Math.min(...v),mx=Math.max(...v);minSpawnValue=Math.max(minSpawnValue,mn);board=board.map(x=>(x===mn||x===mx)?0:x)}}if(id==='mushroom'){let v=board.filter(Boolean),mn=Math.min(...v);board=board.map(x=>x===mn?x*2:x)}if(id==='devil'){board=board.map(x=>x?x*2:0);let levelSkills=defs.filter(x=>x[3]==='level'&&level(x[2])>0);if(levelSkills.length){let target=levelSkills[Math.floor(Math.random()*levelSkills.length)][2],oldLv=level(target);if(target==='maxHp'){maxHp=Math.max(1,maxHp/Math.pow(2,oldLv));playerHp=Math.min(playerHp,maxHp);levelMaxHpFactor=1}else if(target==='baseUp'){baseAttack/=Math.pow(1.2,oldLv);levelBaseUpFactor=1}skills[target]=0;$('log').textContent=`悪魔の契約！盤面を2倍にし、${defs.find(x=>x[2]===target)[0]}をLv0にした！`}}if(id==='lust'){let ids=board.map((x,i)=>x?i:-1).filter(i=>i>=0);for(let z=0;z<Math.min(3,ids.length);z++){let k=Math.floor(Math.random()*ids.length),i=ids.splice(k,1)[0];board[i]*=2}let all=board.map((x,i)=>x?i:-1).filter(i=>i>=0);if(all.length){let i=all[Math.floor(Math.random()*all.length)];board[i]=0}}if(id==='alchemist'){let v=board.filter(Boolean),mn=Math.min(...v),sum=0;board=board.map(x=>x===mn?(sum+=x,0):x);baseAttack+=sum}if(id==='reversal'){let v=board.filter(Boolean),mn=Math.min(...v),mx=Mat function available(){return defs.filter(x=>{
  if(floor%2===1&&x[3]==='level')return false;
  if(floor%2===0&&x[3]!=='level')return false;
  if(x[3]==='card'&&owned(x[2]))return false;
  if(x[3]==='repeat'&&owned(x[2]))return false;
  if(x[3]==='single'&&(owned(x[2])||x[2]==='lust'&&lustUsed))return false;
  return true
})}
function showUpgrade(){paused=false;$('pauseBtn').textContent='⏸ 一時停止';$('floorRule').textContent=floor%2===1?'奇数フロア：カード＋何回でも取得可能':'偶数フロア：レベルアップスキルのみ';let box=$('choices');box.innerHTML='';available().sort(()=>Math.random()-.5).slice(0,3).forEach(s=>{let b=document.createElement('button');b.className='choice '+(s[3]==='level'?'blueChoice':s[3]==='repeat'?'greenChoice':'goldChoice');b.innerHTML=`<b>${s[0]}${s[3]!=='card'?` Lv${level(s[2])+1}`:''}</b><small>${s[1]}</small>`;b.onclick=()=>choose(s);box.appendChild(b)});if(floor%2===1){let skip=document.createElement('button');skip.className='primary';skip.textContent='いらない';skip.onclick=skipSkill;box.appendChild(skip)}$('upgrade').style.display='flex'}
function choose(s){if(s[3]==='card'&&defs.filter(x=>x[3]==='card'&&owned(x[2])).length>=5){let box=$('discardChoices');box.innerHTML='';defs.filter(x=>x[3]==='card'&&owned(x[2])).forEach(d=>{let b=document.createElement('button');b.className='choice goldChoice';b.innerHTML=`<b>${d[0]}</b><small>${d[1]}</small>`;b.onclick=()=>{if(d[2]==='emperor')baseAttack-=emperorBonus,emperorBonus=0;if(d[2]==='greed')greedRecord=0,greedMultiplier=1,greedUroborosUsed=false;skills[d[2]]=false;$('discard').style.display='none';finishChoose(s)};box.appendChild(b)});$('discard').style.display='flex';return}finishChoose(s)}function finishChoose(s){apply(s[2]);if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;$('upgrade').style.display='none';canMove=true;render();$('log').textContent=`${s[0]}を獲得！`}function skipSkill(){if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;$('upgrade').style.display='none';canMove=true;render();$('log').textContent='今回はスキルを取得しなかった！'}$('discardBack').onclick=()=>{$('discard').style.display='none';$('upgrade').style.display='flex'}
function togglePause(){if(!canMove)return;paused=!paused;if(paused){freezeStarted=Date.now();$('pauseBtn').textContent='▶ 再開';$('log').textContent='一時停止中';}else{if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;$('pauseBtn').textContent='⏸ 一時停止';$('log').textContent='ゲーム再開！';}render()}function start(){unlockAudio();ensureAudio();canMove=true;$('start').style.display='none';$('log').textContent='ゲーム開始！';render()}document.addEventListener('touchstart',unlockAudio,{passive:true,once:true});document.addEventListener('pointerdown',unlockAudio,{passive:true,once:true});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'};if(m[e.key]){e.preventDefault();move(m[e.key])}});$('board').addEventListener('touchstart',e=>{let t=e.touches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});$('board').addEventListener('touchend',e=>{if(!touch)return;let t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});$('startBtn').onclick=start;$('restart').onclick=()=>location.reload();$('pauseBtn').onclick=togglePause;board=empty();addRandom();addRandom();spawnEnemy();render();$('start').style.display='flex';setInterval(refreshTimer,100);
