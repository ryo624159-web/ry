/* ===== 敵撃破スペシャル演出 ===== */
.boardShell.enemyDefeatBoardFlash::before{
  content:"";position:absolute;inset:-8px;border-radius:20px;pointer-events:none;z-index:20;
  background:rgba(255,211,61,.0);
  box-shadow:0 0 0 0 rgba(255,210,61,0);
  animation:boardVictoryFlash .72s ease-out forwards;
}
.boardShell.enemyDefeatBoardFlash::after{
  content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;border-radius:50%;
  pointer-events:none;z-index:21;border:4px solid rgba(255,235,120,.95);
  box-shadow:0 0 12px 4px rgba(255,210,61,.9),0 0 34px 12px rgba(255,150,30,.55);
  transform:translate(-50%,-50%) scale(.2);
  animation:defeatShockwave .72s cubic-bezier(.12,.7,.2,1) forwards;
}
.enemyDefeatFlash{
  position:relative;
  animation:enemyDefeatFlashStrong .62s cubic-bezier(.15,.8,.2,1),enemyDefeatPulse .62s ease-out;
}
.enemyDefeatFlash .hp{animation:hpExplodeStrong .62s cubic-bezier(.1,.7,.2,1)}
.enemyDefeatFlash::after{
  content:"";position:absolute;left:50%;top:58%;width:18px;height:18px;border-radius:50%;
  pointer-events:none;background:rgba(255,221,100,.95);
  box-shadow:0 0 12px 5px rgba(255,183,0,.9),0 0 30px 12px rgba(255,90,0,.5);
  transform:translate(-50%,-50%) scale(.2);
  animation:defeatBurst .62s ease-out forwards;
}
@keyframes boardVictoryFlash{
  0%{opacity:0;background:rgba(255,255,255,0);box-shadow:0 0 0 0 rgba(255,210,61,0)}
  12%{opacity:1;background:rgba(255,245,190,.55);box-shadow:0 0 28px 8px rgba(255,210,61,.9),inset 0 0 25px 8px rgba(255,255,255,.55)}
  28%{opacity:1;background:rgba(255,255,255,.18);box-shadow:0 0 55px 16px rgba(255,185,40,.65),inset 0 0 45px 12px rgba(255,255,255,.3)}
  100%{opacity:0;background:rgba(255,255,255,0);box-shadow:0 0 0 0 rgba(255,210,61,0)}
}
@keyframes defeatShockwave{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(15);border-width:1px}
}
@keyframes enemyDefeatFlashStrong{
  0%{filter:brightness(1) saturate(1)}
  18%{filter:brightness(2.8) saturate(1.5)}
  32%{filter:brightness(1.25) saturate(1)}
  48%{filter:brightness(2.1) saturate(1.3)}
  100%{filter:brightness(1) saturate(1)}
}
@keyframes enemyDefeatPulse{
  0%{transform:scale(1)}18%{transform:scale(1.035)}34%{transform:scale(.985)}52%{transform:scale(1.018)}100%{transform:scale(1)}
}
@keyframes hpExplodeStrong{
  0%{filter:brightness(1);box-shadow:0 0 0 0 transparent}
  20%{filter:brightness(3);box-shadow:0 0 22px 8px #ffd23f,0 0 50px 18px rgba(255,90,0,.6)}
  42%{filter:brightness(1.8);box-shadow:0 0 35px 12px #ff9f1c,0 0 70px 25px rgba(255,50,0,.35)}
  100%{filter:brightness(1);box-shadow:0 0 0 0 transparent}
}
@keyframes defeatBurst{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}
  35%{opacity:1;transform:translate(-50%,-50%) scale(2.8)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(7)}
}
.defeatParticle{
  position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
  pointer-events:none;z-index:30;background:#ffd23f;box-shadow:0 0 8px 2px #ffd23f;
  animation:defeatParticleFly .7s cubic-bezier(.1,.7,.2,1) forwards;
}
@keyframes defeatParticleFly{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(8px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(var(--distance)) scale(.2)}
}

.gamblerResult{position:fixed;left:50%;top:48%;z-index:10001;pointer-events:none;transform:translate(-50%,-50%) scale(.7);opacity:0;font-size:clamp(38px,14vw,78px);font-weight:1000;line-height:1;text-shadow:0 3px 8px #000,0 0 20px currentColor;white-space:nowrap;animation:gamblerResultPop .65s ease-out forwards}.gamblerResultBad{color:#e8edf5}.gamblerResultJackpot{color:#fff29a;text-shadow:0 3px 8px #4b2500,0 0 18px #fff,0 0 42px #ffb000}@keyframes gamblerResultPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}30%{transform:translate(-50%,-50%) scale(.96)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04) translateY(-18px)}}
</style>

function $(x){return document.getElementById(x)}
function level(id){return typeof skills[id]==='number'?skills[id]:(skills[id]?1:0)}
function owned(id){return level(id)>0}
function empty(){return Array(16).fill(0)}

function spawnCandidates(){
  let a=[...new Set(board.filter(Boolean))].filter(x=>x>minSpawnValue);
  if(skills.chaos&&a.length)return a;
  let normal=[2,2,2,2,2,2,2,2,2,4].filter(x=>x>minSpawnValue);
  if(normal.length)return normal;
  if(skills.ouroboros&&minSpawnValue>0)return [minSpawnValue*2];
  return normal
}

function spawnTileAt(i){
  if(i<0||i>=16||board[i])return false;
  let c=spawnCandidates();
  if(!c.length)return false;
  let v=c[Math.floor(Math.random()*c.length)];
  if(skills.extraction)v*=4;
  if(v<=minSpawnValue)return false;
  board[i]=v;
  turnNewTiles.push({i,v});
  return true
}

function addRandom(){
  let chaos=!!skills.chaos;
  let n=chaos?2:1;
  for(let z=0;z<n;z++){
    spawnCount++;
    if(!chaos&&skills.extraction&&spawnCount%2===0)continue;
    let e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);
    if(!e.length)continue;
    let i=e[Math.floor(Math.random()*e.length)];
    spawnTileAt(i)
  }
}

function canMerge(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    let i=r*4+c;
    if(!board[i])continue;
    if(c<3&&board[i]===board[i+1])return true;
    if(r<3&&board[i]===board[i+4])return true
  }
  return false
}

function addMummyMergeTile(){
  let e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if(!e.length)return false;
  let i=e[Math.floor(Math.random()*e.length)];
  return spawnTileAt(i)
}

function spawnMummyMinTile(){
  let vals=board.filter(Boolean),e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if(!vals.length||!e.length)return false;
  let v=Math.min(...vals);
  if(v<=minSpawnValue)return false;
  let i=e[Math.floor(Math.random()*e.length)];
  board[i]=v;
  turnNewTiles.push({i,v,mummy:true,noExtraction:true});
  return true
}

function removeRandom(){
  let e=board.map((v,i)=>v?i:-1).filter(i=>i>=0);
  if(e.length)board[e[Math.floor(Math.random()*e.length)]]=0
}

function ensureBoardNotEmpty(){
  if(board.some(v=>v))return false;
  let i=Math.floor(Math.random()*16);
  if(!spawnTileAt(i)){
    let fallback=minSpawnValue>0?minSpawnValue*2:2;
    board[i]=fallback;
    turnNewTiles.push({i,v:fallback})
  }
  return true
}

function processEmperor(){
  if(!skills.emperor)return 0;
  let vals=board.filter(Boolean),mx=vals.length?Math.max(...vals):0;
  if(mx>previousMax){
    baseAttack+=mx;
    emperorBonus+=mx;
    previousMax=mx;
    return mx
  }
  return 0
}

function recordRaised(before){
  for(let i=0;i<16;i++){
    let b=before[i]||0,v=board[i]||0;
    if(v>b)turnNewTiles.push({i,v,raised:true})
  }
}

function triggerGreed(){
  if(!skills.greed)return 0;
  let removed=0,removedValues=[],seen=new Set();
  for(let x of turnNewTiles){
    if(seen.has(x.i))continue;
    let v=board[x.i]||0;
    if(!x.greedSafe&&x.v>greedRecord&&v>greedRecord){
      board[x.i]=0;
      removed++;
      removedValues.push(v);
      seen.add(x.i)
    }
  }
  if(removed){
    greedMultiplier*=Math.pow(1.1,removed);
    let uro=false;
    if(skills.ouroboros&&!greedUroborosUsed){
      let direct=Math.floor((removedValues[0]||0)/8);
      if(direct>minSpawnValue){
        let e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);
        if(e.length){
          let i=e[Math.floor(Math.random()*e.length)];
          board[i]=direct;
          turnNewTiles.push({i,v:direct,greedSafe:true});
          uro=true;
          greedUroborosUsed=true
        }
      }
    }
    setLog(`強欲！基準値${fmt(greedRecord)}を超えた増加タイルを${removed}個消去、コンボ倍率×${Math.pow(1.1,removed).toFixed(2)}${uro?'、ウロボロスで1/8を出現！':''}`,`Greed! Removed ${removed} boosted tile${removed===1?'':'s'} above threshold ${fmt(greedRecord)}. Combo ×${Math.pow(1.1,removed).toFixed(2)}${uro?' Ouroboros spawned 1/8!':''}`);
    render()
  }
  return removed
}

function spawnEnemy(){
  let t=enemies[(floor-1)%enemies.length],
      hp=floor===1?400:Math.round(enemy.maxHp*(floor>100?floor/50:1.4)),
      atk=2;

  if(skills.backwater)playerHp=Math.max(0,maxHp/2);

  for(let f=2;f<=floor;f++){
    if(f<=100){
      if(f%10===1)atk=Math.round(atk*1.5);
      if(f%50===0)atk*=f/5;
      else atk+=1
    }else{
      atk*=1.2;
      if(f%10===0)atk*=1.7;
    }
  }

  enemy={name:t.name,hp,maxHp:hp,atk,type:t.type,desc:t.desc};

  if(skills.reaper)enemy.atk*=Math.pow(2,level('reaper'));

  enemyTurn=0;
  enemyCharge=false
}

function fmt(n){
  n=Math.max(0,Math.round(n));
  if(n<=8192)return String(n);
  // Large-number units: K, M, G, T, P, E, Z, Y
  const units=[
    ['Y',1e24],['Z',1e21],['E',1e18],['P',1e15],
    ['T',1e12],['G',1e9],['M',1e6],['K',1e3]
  ];
  for(const [u,v] of units){
    if(n>=v)return Math.floor(n/v)+u;
  }
  return String(n);
}

function fmtDamage(n){return Math.max(0,Math.round(n)).toLocaleString('en-US')}

function queueTileEffect(indices,type){
  indices.filter(i=>i>=0&&i<board.length).forEach(i=>pendingTileEffects.push({i,type}));
}

function queueBoardDiff(before,after){
  for(let i=0;i<16;i++){
    let b=before[i]||0,a=after[i]||0;
    if(b===a)continue;
    if(b===0&&a>0)queueTileEffect([i],'up');
    else if(a>b)queueTileEffect([i],'up');
    else if(a<b)queueTileEffect([i],'down');
  }
}

function render(){
  let b=$('board');
  b.innerHTML='';
  let effects=pendingTileEffects.splice(0);
  board.forEach((v,i)=>{
    let d=document.createElement('div');
    let fx=effects.filter(e=>e.i===i);
    d.className='tile '+(v?'t'+v:'')+(i===mageTarget?' mageTarget':'')+(i===hunterTarget?' hunterTarget':'');
    if(fx.length){
      let types=[...new Set(fx.map(e=>e.type))];
      if(types.includes('up'))d.classList.add('tileFxUp');
      if(types.includes('down'))d.classList.add('tileFxDown');
      if(types.includes('hunter'))d.classList.add('tileFxHunter');
      if(types.includes('mage'))d.classList.add('tileFxMage');
      if(types.includes('lust'))d.classList.add('tileFxLust');
      if(types.includes('devil'))d.classList.add('tileFxDevil');
    }
    d.textContent=v?fmt(v):'';
    if(i===hunterTarget&&hunterTarget>=0){
      let turns=Math.max(1,6-(enemyTurn%6));
      let badge=document.createElement('span');
      badge.className='hunterTimer';
      badge.textContent=String(turns);
      d.appendChild(badge);
    }
    b.appendChild(d)
  });

  $('floor').textContent=floor;
  $('atk').textContent=fmt(baseAttack);
  $('score').textContent=fmt(score);
  $('enemyName').textContent=enemyDisplayName(enemy.name);
  $('enemyText').textContent=`${fmt(enemy.hp)} / ${fmt(enemy.maxHp)}`;
  $('enemyHp').style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+'%';
  $('playerHp').textContent=`${fmt(playerHp)} / ${fmt(maxHp)}`;
  $('playerHpFill').style.width=Math.max(0,playerHp/maxHp*100)+'%';
  updateComboDisplay();
  renderSkills();
  refreshTimer();
}

function renderSkills(){
  let box=$('skillList');
  box.innerHTML='';
  let arr=defs.filter(x=>owned(x[2]));
  if(!arr.length){
    box.innerHTML=`<span style="color:#777;font-size:11px">${currentLang==='en'?LANG.ui.none:'なし'}</span>`;
    return
  }
  arr.forEach(x=>{
    let d=document.createElement('span');
    d.className='badge '+(x[3]==='level'?'blue':x[3]==='repeat'?'green':'gold');
    d.textContent=skillName(x[0])+(x[3]==='level'?` Lv${level(x[2])}`:'');
    d.title=skillDesc(x[0]);
    box.appendChild(d)
  })
}

function timeLimit(){
  let t=1900+skills.comboTime*150-Math.max(0,combo-1)*240-skills.dependence*10-skills.gambler*30;
  if(skills.magician)t*=.4;
  t+=embryoTimeBonus;
  return Math.max(0.01,t)
}

function mult(){
  let comboGain=angerComboMode?.03:(.08+skills.comboUp*.03);
  let m=(1+Math.max(0,combo-1)*comboGain+heroBonus)*greedMultiplier;
  if(skills.magician)m*=2;
  return m
}

function updateComboDisplay(){
  $('combo').textContent=combo;
  $('mult').textContent='×'+mult().toFixed(2)
}

function refreshTimer(){
  let r=0;

  if(combo){
    if(paused&&freezeStarted){
      r=frozenRemaining;
    }else if(!canMove&&freezeStarted){
      r=frozenRemaining;
    }else if(deadline){
      r=Math.max(0,deadline-Date.now());
    }
  }

  $('timer').textContent=combo&&deadline?(r/1000).toFixed(1)+'s':'-';
  $('comboFill').style.width=combo?Math.max(0,r/timeLimit()*100)+'%':'0%'
}

function startTimer(){
  clearInterval(timerId);

  if(!combo){
    refreshTimer();
    return
  }

  timerId=setInterval(()=>{
    if(paused||!canMove){
      refreshTimer();
      return
    }

    if(!deadline){
      deadline=Date.now()+timeLimit()
    }

    if(Date.now()>=deadline){
      let oldCombo=combo;
      combo=Math.max(0,combo-1);

      if(combo){
        deadline=Date.now()+timeLimit()
      }else{
        deadline=0
      }

      if(combo!==oldCombo){
        updateComboDisplay();
        if(combo)comboVisual(combo)
      }

      if(!combo){
        clearInterval(timerId);
        timerId=null
      }
    }

    refreshTimer()
  },50)
}

function slide(a,rev){
  let x=rev?[...a].reverse():[...a],c=x.filter(Boolean),r=[],g=[],m=[];
  for(let i=0;i<c.length;i++){
    if(i+1<c.length&&c[i]===c[i+1]){
      r.push(c[i]*2);
      g.push(c[i]*2);
      m.push(r.length-1);
      i++
    }else r.push(c[i])
  }
  while(r.length<4)r.push(0);
  if(rev)m=m.map(i=>3-i);
  return {v:rev?r.reverse():r,g,m}
}

function ensureAudio(){
  try{
    if(!audioCtx||audioCtx.state==='closed'){
      let C=window.AudioContext||window.webkitAudioContext;
      if(!C)return null;
      audioCtx=new C()
    }
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    return audioCtx
  }catch(e){return null}
}

function unlockAudio(){
  let a=ensureAudio();
  if(a&&a.state==='suspended')a.resume().catch(()=>{});
  if(a){
    try{
      let g=a.createGain();
      g.gain.value=0;
      g.connect(a.destination);
      let o=a.createOscillator();
      o.frequency.value=1;
      o.connect(g);
      o.start();
      o.stop(a.currentTime+.01)
    }catch(e){}
  }
}

function tone(freq,dur=.08,type='sine',gain=.035){
  let a=ensureAudio();
  if(!a)return;
  if(a.state==='suspended'){
    a.resume().then(()=>tone(freq,dur,type,gain)).catch(()=>{});
    return
  }
  try{
    let o=a.createOscillator(),g=a.createGain(),now=a.currentTime;
    o.type=type;
    o.frequency.setValueAtTime(freq,now);
    g.gain.setValueAtTime(gain,now);
    g.gain.exponentialRampToValueAtTime(.001,now+dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(now);
    o.stop(now+dur)
  }catch(e){}
}

function move(dir){
  if(!canMove||paused)return;
  ensureAudio();

  let before=board.slice(),g=[];
  turnNewTiles=[];

  for(let l=0;l<4;l++){
    let idx=[];
    for(let k=0;k<4;k++)idx.push((dir==='left'||dir==='right')?l*4+k:k*4+l);
    let r=slide(idx.map(i=>board[i]),dir==='right'||dir==='down');
    idx.forEach((i,k)=>board[i]=r.v[k]);
    r.m.forEach(k=>{if(r.v[k])turnNewTiles.push({i:idx[k],v:r.v[k]})});
    g.push(...r.g)
  }

  if(board.every((v,i)=>v===before[i]))return;
  recordRaised(before);

  if(mageTarget>=0){
    let i=mageTarget;
    if(board[i]!==0){
      let next=Math.floor(board[i]/2);
      if(next>=2&&next>minSpawnValue){
        board[i]=next;
        queueTileEffect([i],'down'); queueTileEffect([i],'mage');
        setLog('魔術師が指定したマスを半分にした！','The Mage halved the selected tile!')
      }else{
        setLog('魔術師の攻撃は無効になった！','The Mage’s attack was nullified!')
      }
      mageTarget=-1
    }else mageTarget=-1
  }

  previousMax=Math.max(...before);

  if(skills.chaos)removeRandom();

  if(g.length){
    if(skills.embryo)embryoTimeBonus+=50;
    combo+=skills.embryo?g.length:1;
    deadline=Date.now()+timeLimit();
    frozenRemaining=0;
    startTimer();
    comboVisual(combo);

    if(skills.dependence&&combo>=2)baseAttack+=6;
    processEmperor();

    let sum=board.reduce((a,v)=>a+v,0),
        h=skills.hunger?board.filter(v=>v===0).length*.25:1,
        damage=Math.floor(baseAttack*sum*mult()*h);

    if(enemy.type==='golem'){
      let cut=Math.min(1,1.2/Math.max(1,combo));
      damage=Math.floor(damage*(1-cut))
    }

    if(skills.overreaction&&g.some(v=>v>=previousMax))damage*=3;
    if(skills.mummy)damage*=2;
    if(skills.berserker&&playerHp<=maxHp*.75)damage*=2;
    if(skills.backwater)damage*=maxHp/Math.max(1,playerHp)/2;

    let gamblerMultiplier=1;
    if(skills.gambler){
      // Five fixed multipliers. The distribution shifts from low to high as Combo rises.
      const gamblerPoints=[
        [0,  [45,30,15, 8, 2]],
        [5,  [38,27,15,14, 6]],
        [10, [25,20,10,25,20]],
        [15, [15,15, 8,27,35]],
        [20, [ 8,10, 6,26,50]],
        [25, [ 3, 7, 5,23,62]],
        [30, [ 1, 4, 5,20,70]]
      ];
      const c=Math.min(30,Math.max(0,combo));
      let lo=gamblerPoints[0],hi=gamblerPoints[gamblerPoints.length-1];
      for(let i=0;i<gamblerPoints.length-1;i++){
        if(c>=gamblerPoints[i][0]&&c<=gamblerPoints[i+1][0]){lo=gamblerPoints[i];hi=gamblerPoints[i+1];break}
      }
      const span=hi[0]-lo[0], t=span?(c-lo[0])/span:0;
      const weights=lo[1].map((v,i)=>v+(hi[1][i]-v)*t);
      const roll=Math.random()*100;
      let acc=0;
      const values=[.1,.5,1,2,3];
      for(let i=0;i<values.length;i++){
        acc+=weights[i];
        if(roll<acc){gamblerMultiplier=values[i];break}
      }
      damage*=gamblerMultiplier;
    }
    damage=Math.max(0,Math.round(damage));

    let attacks=g.length+(skills.chainCannon&&g.length>=3?1:0)+(skills.chainCannon&&g.length>=5?1:0);

    for(let i=0;i<attacks;i++){
      enemy.hp-=damage;
      score+=damage;
      if(enemy.hp<=0)break
    }

    bubble(damage);
    if(skills.gambler){
      if(gamblerMultiplier===0.1){
        gamblerFlash('dark');
        gamblerResult(0.1);
        playGamblerBadSound(0.1);
      }else if(gamblerMultiplier===0.5){
        gamblerResult(0.5);
        playGamblerBadSound(0.5);
      }else{
        playComboSound(combo);
        if(gamblerMultiplier===2){
          gamblerFlash('white');
          gamblerResult(2);
        }else if(gamblerMultiplier===3){
          gamblerJackpotVisual();
          gamblerResult(3);
          playGamblerJackpotSound();
        }
      }
        playComboSound(combo);
        if(gamblerMultiplier===2){
          gamblerFlash('white');
        }else if(gamblerMultiplier===3){
          gamblerFlash('gold');
          playGamblerJackpotSound();
        }
      }
    }else{
      playComboSound(combo);
    }
    playHitSound();
    triggerGreed();
    setLog(`合体攻撃！ ${fmtDamage(damage)}ダメージ ×${attacks}回 / ${combo}コンボ`,`Merge attack! ${fmtDamage(damage)} damage ×${attacks} attacks / ${combo} Combo`)
  }else{
    if(skills.accumulation)baseAttack*=1.01;
    setLog('スライド！','Slide!')
  }

  if(!skills.mummy){
    addRandom()
  }else if(g.length){
    for(let z=0;z<g.length;z++)addMummyMergeTile()
  }else if(!canMerge()){
    spawnMummyMinTile()
  }

  processEmperor();

  if(!g.length)triggerGreed();

  if(ensureBoardNotEmpty()){
    processEmperor();
    setLog('盤面が空になったため、通常の出現ルールで数字を配置！','The board was cleared, so tiles were spawned using the normal rules!')
  }

  if(!board.every(v=>v===0)&&!canMoves()){
    render();
    gameOver();
    return
  }

  if(enemy.hp<=0){
    canMove=false;
    if(combo&&deadline&&!freezeStarted){freezeStarted=Date.now();frozenRemaining=Math.max(0,deadline-Date.now())};
    render();
    playEnemyDefeatSound();
    enemyDefeatVisual();
    setTimeout(()=>win(),420);
    return
  }

  enemyAttack();

  if(skills.hero)heroBonus+=.01;

  if(skills.blessing){
    let loss=Math.max(1,Math.floor(maxHp/16));
    playerHp=Math.max(0,playerHp-loss);
    baseAttack*=1.02
  }

  if(isDead())gameOver();
  render()
}

function enemyAttack(){
  let beforeEnemyAttack=board.slice();
  enemyTurn++;
  let action='';

  if(enemy.type==='slime'&&enemyTurn%3===0){
    let heal=Math.max(1,Math.floor(enemy.maxHp*.01));
    enemy.hp=Math.min(enemy.maxHp,enemy.hp+heal);
    let e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);

    if(e.length){
      let splitValue=Math.min(...board.filter(Boolean));
      if(splitValue>minSpawnValue){
        let i=e[Math.floor(Math.random()*e.length)];
        board[i]=splitValue;
        turnNewTiles.push({i,v:splitValue})
      }
      action=currentLang==='en'?`The Slime split! HP +${fmt(heal)}`:`スライムが分裂！HP+${fmt(heal)}`
    }
  }

  if(enemy.type==='ogre'&&enemyTurn%3===0){
    enemyCharge=true;
    action=currentLang==='en'?'The Ogre is charging power!':'オーガが力を溜めている！'
  }

  let d=Math.max(1,Math.round(enemy.atk*(0.8+Math.random()*0.2)));

  if(enemy.type==='ogre'&&enemyCharge&&enemyTurn%3!==0){
    d*=2;
    enemyCharge=false;
    action=currentLang==='en'?'The Ogre delivers a powerful strike!':'オーガの強烈な一撃！'
  }

  if(enemy.type==='mage'&&enemyTurn%2===0){
    let ids=board.map((v,i)=>v?i:-1).filter(i=>i>=0),vals=board.filter(Boolean);
    if(ids.length&&vals.length>1){
      mageTarget=ids[Math.floor(Math.random()*ids.length)];
      action=currentLang==='en'?'The Mage selected a tile to halve!':'魔術師が半分にするマスを指定した！'
    }
  }

  if(enemy.type==='hunter'&&enemyTurn%6===1){
    let vals=board.filter(Boolean);
    if(vals.length){
      hunterTargetValue=Math.max(...vals);
      hunterTarget=board.indexOf(hunterTargetValue);
      action=currentLang==='en'?'The Hunter is taking aim!':'ハンターが狙いを定めた！'
    }
  }

  if(enemy.type==='hunter'&&enemyTurn%6===0){
    let i=hunterTarget;
    if(i>=0&&board[i]===hunterTargetValue){
      let mx=board[i],next=Math.floor(mx/4);
      if(next>=2&&next>minSpawnValue){
        board[i]=next;
        queueTileEffect([i],'down'); queueTileEffect([i],'hunter');
        action=currentLang==='en'?`The Hunter quartered the maximum tile (${mx})!`:`ハンターが最大値 ${mx} を4分の1にした！`
      }else{
        action=currentLang==='en'?'The Hunter’s attack was nullified!':'ハンターの攻撃は無効になった！'
      }
    }else if(i>=0){
      action=currentLang==='en'?'The Hunter missed!':'ハンターの狙いが外れた！'
    }
    hunterTarget=-1;
    hunterTargetValue=0
  }

  if(triggerGreed()&&board.every(v=>v===0))ensureBoardNotEmpty();

  if(skills.colored)d=Math.ceil(maxHp/2);
  if(skills.hero)d=Math.ceil(d*1.3);

  playerHp=Math.max(0,playerHp-d);

  if(d){
    bubble(d,'player');
    playPlayerHitSound();
    shake();
    if(skills.grudge)baseAttack*=1.01;
    setLog((action?action+' ':'')+`敵の攻撃！ ${fmtDamage(d)}ダメージ`,(action?action+' ':'')+`Enemy attack! ${fmtDamage(d)} damage`)
  }

  if(playerHp<=0&&skills.sacrifice){
    let v=board.filter(Boolean);
    if(v.length>=3){
      let m=Math.max(...v),i=board.indexOf(m);
      board[i]=0;
      playerHp=Math.min(maxHp,m);
      setLog(`生贄！ ${fmt(m)}を犠牲に復活！`,`Sacrifice! Revived by sacrificing ${fmt(m)}.`)
    }
  }

  queueBoardDiff(beforeEnemyAttack,board);

  if(playerHp<=0){
    gameOver();
    return;
  }

  if(skills.regen){
    let h=2*Math.pow(2,skills.regen-1);
    playerHp=Math.min(maxHp,playerHp+h)
  }

  if(action&&!d)$('log').textContent=action
}

function win(){
  mageTarget=-1;
  hunterTarget=-1;
  hunterTargetValue=0;

  if(skills.multiplication){
    const currentValues=board.filter(Boolean);
    const spawnMin=currentValues.length?Math.min(...currentValues):0;
    let e=board.map((x,i)=>x?-1:i).filter(i=>i>=0);

    if(spawnMin>minSpawnValue&&e.length){
      let n=Math.min(3,e.length);

      for(let z=0;z<n;z++){
        let k=Math.floor(Math.random()*e.length),i=e.splice(k,1)[0];
        board[i]=spawnMin;
        turnNewTiles.push({i,v:spawnMin})
      }
    }
  }

  if(!board.every(v=>v===0)&&!canMoves()){
    render();
    gameOver();
    return
  }

  if(triggerGreed()&&board.every(v=>v===0))ensureBoardNotEmpty();

  if(!board.every(v=>v===0)&&!canMoves()){
    render();
    gameOver();
    return
  }

  score+=enemy.maxHp;
  floor++;
  playerHp=maxHp;
  skills.chaos=false;
  spawnEnemy();

  canMove=false;

  // スキル選択画面に入った瞬間の残り時間を保存して凍結
  if(!freezeStarted){
    freezeStarted=Date.now();
    frozenRemaining=combo&&deadline?Math.max(0,deadline-Date.now()):0;
  }

  render();

  if(!paused){
    showUpgrade()
  }
}

function isDead(){return playerHp<=0||(!board.every(v=>v===0)&&!canMoves())}

function canMoves(){
  if(board.some(v=>!v))return true;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    let i=r*4+c;
    if(c<3&&board[i]===board[i+1]||r<3&&board[i]===board[i+4])return true
  }
  return false
}

function gameOver(){
  $('final').textContent=currentLang==='en'?`Floor Reached: ${floor}　Score: ${score}`:`到達フロア: ${floor}　スコア: ${score}`;
  $('gameover').style.display='flex';
  canMove=false;

  timerId=null
}

function apply(id){
  let s=defs.find(x=>x[2]===id);
  if(!s)return;

  let beforeApply=board.slice();

  if(s[3]==='repeat'||s[3]==='level'){
    skills[id]=(typeof skills[id]==='number'?skills[id]:0)+1
  }else{
    skills[id]=true
  }

  if(id==='extraction'){
    if(skills.greed&&Number.isFinite(greedRecord)&&greedRecord>0)greedRecord*=4
  }

  if(id==='emperor'){
    let v=board.filter(Boolean),mx=v.length?Math.max(...v):0;
    baseAttack+=mx;
    emperorBonus+=mx;
    previousMax=mx
  }

  if(id==='greed'){
    let v=board.filter(Boolean);
    greedRecord=v.length?Math.max(...v):0;
    greedUroborosUsed=false
  }

  if(id==='maxHp'){
    maxHp*=2;
    levelMaxHpFactor*=2;
    playerHp+=maxHp/2
  }

  if(id==='weakling'){
    let newMaxHp=Math.max(1,Math.floor(maxHp/2)),loss=maxHp-newMaxHp;
    maxHp=newMaxHp;
    playerHp=Math.min(playerHp,maxHp);
    baseAttack+=loss
  }

  if(id==='ouroboros'){
    let v=board.filter(Boolean);
    if(v.length){
      let mn=Math.min(...v),mx=Math.max(...v);
      minSpawnValue=Math.max(minSpawnValue,mn);
      board=board.map(x=>(x===mn||x===mx)?0:x)
    }
  }

  if(id==='mushroom'){
    let v=board.filter(Boolean);
    if(v.length){
      let mn=Math.min(...v);
      board=board.map(x=>x===mn?x*2:x)
    }
  }

  if(id==='devil'){
    let changed=board.map((x,i)=>x?i:-1).filter(i=>i>=0);
    board=board.map(x=>x?x*2:0);
    queueTileEffect(changed,'up'); queueTileEffect(changed,'devil');
    let levelSkills=defs.filter(x=>x[3]==='level'&&level(x[2])>0);

    if(levelSkills.length){
      let target=levelSkills[Math.floor(Math.random()*levelSkills.length)][2],oldLv=level(target);

      if(target==='maxHp'){
        maxHp=Math.max(1,maxHp/Math.pow(2,oldLv));
        playerHp=Math.min(playerHp,maxHp);
        levelMaxHpFactor=1
      }else if(target==='baseUp'){
        baseAttack/=Math.pow(1.2,oldLv);
        levelBaseUpFactor=1
      }

      skills[target]=0;
      setLog(`悪魔の契約！盤面を2倍にし、${defs.find(x=>x[2]===target)[0]}をLv0にした！`,`Devil’s Contract! Doubled the board and reduced ${skillName(defs.find(x=>x[2]===target)[0])} to Lv0.`)
    }
  }

  if(id==='lust'){
    let ids=board.map((x,i)=>x?i:-1).filter(i=>i>=0),doubled=[];

    for(let z=0;z<Math.min(3,ids.length);z++){
      let k=Math.floor(Math.random()*ids.length),i=ids.splice(k,1)[0];
      board[i]*=2; doubled.push(i)
    }
    queueTileEffect(doubled,'up'); queueTileEffect(doubled,'lust');

    let all=board.map((x,i)=>x?i:-1).filter(i=>i>=0);
    if(all.length){
      let i=all[Math.floor(Math.random()*all.length)];
      board[i]=0;
    }
  }

  if(id==='alchemist'){
    let v=board.filter(Boolean);
    if(v.length){
      let mn=Math.min(...v),sum=0;
      board=board.map(x=>x===mn?(sum+=x,0):x);
      baseAttack+=sum
    }
  }

  if(id==='reversal'){
    let v=board.filter(Boolean);
    if(v.length){
      let mn=Math.min(...v),mx=Math.max(...v);
      board=board.map(x=>x===mn?mx:x===mx?mn:x)
    }
  }

  if(id==='gluttony'){
    let v=board.filter(Boolean);
    if(v.length){
      let mx=Math.max(...v),i=board.indexOf(mx);
      board[i]=0;
      baseAttack+=mx*1.2
    }
  }

  if(id==='reaper'){
    enemy.hp=Math.max(1,Math.floor(enemy.hp/2));
    enemy.atk*=2
  }

  if(id==='cleanse'){
    let vals=board.filter(Boolean);
    if(vals.length){
      let mn=Math.min(...vals),ids=board.map((x,i)=>x===mn?i:-1).filter(i=>i>=0),n=Math.min(2,ids.length),sum=0;

      for(let z=0;z<n;z++){
        let k=Math.floor(Math.random()*ids.length),i=ids.splice(k,1)[0];
        sum+=board[i];
        board[i]=0
      }

      combo+=sum;
      deadline=Date.now()+timeLimit();
      frozenRemaining=0;
      startTimer();
      setLog(`洗浄！最小タイルを${n}個破壊、コンボ+${sum}`,`Cleanse! Destroyed ${n} minimum-value tile${n===1?'':'s'}, Combo +${sum}`)
    }
  }

  if(id==='bomb'){
    let v=board.filter(Boolean);

    if(v.length&&new Set(v).size>1){
      let mx=Math.max(...v),sum=0,kept=false;
      board=board.map(x=>{
        if(x===mx&&!kept){
          kept=true;
          return x
        }
        if(x)sum+=x;
        return 0
      });
      baseAttack+=sum*2
    }
  }

  if(id==='baseUp'){
    baseAttack*=1.2;
    levelBaseUpFactor*=1.2
  }

  if(id==='blessing'){
    let loss=Math.max(1,Math.floor(maxHp/16));
    playerHp=Math.max(0,playerHp-loss);
    baseAttack*=1.02
  }

  if(id==='anger'){
    const currentMultiplier=mult();
    angerComboMode=true;
    baseAttack*=currentMultiplier;

    // 憤怒は現在のコンボ倍率を攻撃力へ変換してから、
    // コンボ関連の状態とマジシャン／強欲の倍率効果を初期化する。
    combo=0;
    heroBonus=0;
    deadline=0;
    clearInterval(timerId);
    timerId=null;
    frozenRemaining=0;
    freezeStarted=0;
    skills.magician=false;
    skills.greed=false;
    greedMultiplier=1;
    greedRecord=0;
    // ウロボロスの使用状態は憤怒ではリセットしない。
  }

  recordRaised(beforeApply);
  queueBoardDiff(beforeApply,board);
  processEmperor();

  if(id!=='greed')triggerGreed();

  if(!board.some(v=>v))ensureBoardNotEmpty()
}

function available(){
  return defs.filter(x=>{
    if(floor%2===1&&x[3]==='level')return false;
    if(floor%2===0&&x[3]!=='level')return false;
    if(x[3]==='card'&&owned(x[2]))return false;
    return true
  })
}

function showUpgrade(){
  // スキル選択中はゲームを停止したままにする
  paused=false;
  canMove=false;
  $('pauseBtn').textContent=currentLang==='en'?'⏸ Pause':'⏸ 一時停止';
  $('floorRule').textContent=currentLang==='en'?(floor%2===1?LANG.ui.odd:LANG.ui.even):(floor%2===1?'奇数フロア：カード＋何回でも取得可能':'偶数フロア：レベルアップスキルのみ');

  let box=$('choices');
  box.innerHTML='';

  available().sort(()=>Math.random()-.5).slice(0,3).forEach(s=>{
    let b=document.createElement('button');
    b.className='choice '+(s[3]==='level'?'blueChoice':s[3]==='repeat'?'greenChoice':'goldChoice');
    let countText=s[3]==='level'?` Lv${level(s[2])+1}`:s[3]==='repeat'?` ×${level(s[2])+1}`:'';
    b.dataset.skill=s[0]; b.innerHTML=`<b>${skillName(s[0])}${countText}</b><small>${skillDesc(s[0])}</small>`;
    b.onclick=()=>choose(s);
    box.appendChild(b)
  });

  if(floor%2===1){
    let skip=document.createElement('button');
    skip.className='primary';
    skip.textContent=currentLang==='en'?LANG.ui.skip:'いらない';
    skip.onclick=skipSkill;
    box.appendChild(skip)
  }

  $('upgrade').style.display='flex'
}

function choose(s){
  if(s[3]==='card'&&defs.filter(x=>x[3]==='card'&&owned(x[2])).length>=5){
    let box=$('discardChoices');
    box.innerHTML='';

    defs.filter(x=>x[3]==='card'&&owned(x[2])).forEach(d=>{
      let b=document.createElement('button');
      b.className='choice goldChoice';
      b.dataset.skill=d[0]; b.innerHTML=`<b>${skillName(d[0])}</b><small>${skillDesc(d[0])}</small>`;

      b.onclick=()=>{
        if(d[2]==='emperor')baseAttack-=emperorBonus,emperorBonus=0;
        if(d[2]==='greed')greedRecord=0,greedMultiplier=1,greedUroborosUsed=false;
        skills[d[2]]=false;
        $('discard').style.display='none';
        finishChoose(s)
      };

      box.appendChild(b)
    });

    $('discard').style.display='flex';
    return
  }

  finishChoose(s)
}

function finishChoose(s){
  apply(s[2]);

  if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;
  freezeStarted=0;
  frozenRemaining=0;

  $('upgrade').style.display='none';
  canMove=true;
  render();
  setLog(`${s[0]}を獲得！`,`${skillName(s[0])} acquired!`);

  if(combo)startTimer()
}

function skipSkill(){
  if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;
  freezeStarted=0;
  frozenRemaining=0;

  $('upgrade').style.display='none';
  canMove=true;
  render();
  setLog('今回はスキルを取得しなかった！',LANG.ui.noSkill);

  if(combo)startTimer()
}

$('discardBack').onclick=()=>{
  $('discard').style.display='none';
  $('upgrade').style.display='flex'
};

function togglePause(){
  if(!canMove)return;

  paused=!paused;

  if(paused){
    freezeStarted=Date.now();
    frozenRemaining=combo&&deadline?Math.max(0,deadline-Date.now()):0;
    $('pauseBtn').textContent=currentLang==='en'?'▶ Resume':'▶ 再開';
    setLog('一時停止中','Paused');
  }else{
    if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;
    freezeStarted=0;
    frozenRemaining=0;
    $('pauseBtn').textContent='⏸ 一時停止';
    setLog('ゲーム再開！','Game resumed!');
    if(combo)startTimer()
  }

  render()
}

function start(){
  unlockAudio();
  ensureAudio();
  canMove=true;
  $('start').style.display='none';
  setLog('ゲーム開始！','Game started!');
  render();
  if(combo)startTimer()
}

document.addEventListener('touchstart',unlockAudio,{passive:true,once:true});
document.addEventListener('pointerdown',unlockAudio,{passive:true,once:true});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!e.repeat)togglePause();
    return
  }

  let m={
    ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
    w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'
  };

  if(m[e.key]){
    e.preventDefault();
    move(m[e.key])
  }
});

$('board').addEventListener('touchstart',e=>{
  let t=e.touches[0];
  touch={x:t.clientX,y:t.clientY}
},{passive:true});

$('board').addEventListener('touchend',e=>{
  if(!touch)return;
  let t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;
  touch=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')
},{passive:true});

$('startBtn').onclick=start;
$('restart').onclick=()=>location.reload();
$('pauseBtn').onclick=togglePause;

board=empty();
addRandom();
addRandom();
spawnEnemy();
render();
$('start').style.display='flex';

window.setLanguage=setLanguage;
$('langBtn').onclick=()=>setLanguage(currentLang==='ja'?'en':'ja');
setLanguage('ja');
</script>
</body>
